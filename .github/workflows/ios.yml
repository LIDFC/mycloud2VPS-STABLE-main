name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(iphones[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build & test
        run: |
          set +e
          xcodebuild test \
            -project MyCloud.xcodeproj \
            -scheme MyCloud \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1
          STATUS=$?
          grep -iE "error:|warning:|test case .* failed|failing tests|executed|\*\* (build|test)" xcodebuild.log | grep -v "not stripping binary" | sort -u | tail -200
          exit $STATUS

      - name: Test summary
        if: always()
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact \
            | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          print("Result: {}  total={} passed={} failed={} skipped={}".format(
              s.get("result"), s.get("totalTestCount"), s.get("passedTests"),
              s.get("failedTests"), s.get("skippedTests")))
          for t in s.get("testFailures", []):
              print("FAILED:", t.get("testIdentifierString"), "-", t.get("failureText"))
          ' || true

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log
