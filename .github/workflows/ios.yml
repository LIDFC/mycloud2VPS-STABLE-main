name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [d for runtime, ds in devices.items() if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          print(iphones[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build & test
        run: |
          set +e
          xcodebuild test \
            -project MyCloud.xcodeproj \
            -scheme MyCloud \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:MyCloudUITests/ScreenshotTests \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1
          STATUS=$?
          grep -iE "error:|warning:|test case .* failed|failing tests|executed|\*\* (build|test)" xcodebuild.log | grep -v "not stripping binary" | sort -u | tail -200
          exit $STATUS

      - name: Test summary
        if: always()
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary --path TestResults.xcresult --compact \
            | python3 -c '
          import json, sys
          s = json.load(sys.stdin)
          print("Result: {}  total={} passed={} failed={} skipped={}".format(
              s.get("result"), s.get("totalTestCount"), s.get("passedTests"),
              s.get("failedTests"), s.get("skippedTests")))
          for t in s.get("testFailures", []):
              print("FAILED:", t.get("testIdentifierString"), "-", t.get("failureText"))
          ' || true

      - name: Upload results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            ios/TestResults.xcresult
            ios/xcodebuild.log

  screenshots:
    name: Screenshots
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project MyCloud.xcodeproj \
            -scheme MyCloud \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || { tail -80 build.log; exit 1; }

      - name: Capture screenshots
        env:
          # TEST_RUNNER_-prefixed variables reach the UI test process without the prefix.
          TEST_RUNNER_MYCLOUD_USERNAME: ${{ secrets.MYCLOUD_TEST_USERNAME }}
          TEST_RUNNER_MYCLOUD_PASSWORD: ${{ secrets.MYCLOUD_TEST_PASSWORD }}
        run: |
          mkdir -p screenshots
          for DEVICE in "iPhone SE (3rd generation)" "iPhone 16 Pro Max"; do
            UDID=$(xcrun simctl list devices available -j | DEVICE="$DEVICE" python3 -c '
          import json, os, sys
          wanted = os.environ["DEVICE"]
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds]
          exact = [d for d in devices if d["name"] == wanted]
          # Newer runtimes rename devices: fall back to the nearest small / large iPhone.
          hint = "Pro Max" if "Pro Max" in wanted else ("e" if "SE" in wanted else None)
          fallback = [d for d in devices if hint and (d["name"].endswith(hint) or "SE" in d["name"] and hint == "e")]
          pick = (exact or fallback)
          print(pick[-1]["udid"] if pick else "")')
            if [ -z "$UDID" ]; then echo "::warning::No simulator for $DEVICE"; continue; fi
            SLUG=$(echo "$DEVICE" | tr -cs "A-Za-z0-9" "-" | sed "s/-*$//")
            echo "=== $DEVICE ($UDID) -> $SLUG"
            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged \
              --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3 || true

            xcodebuild test-without-building \
              -project MyCloud.xcodeproj \
              -scheme MyCloud \
              -destination "id=$UDID" \
              -derivedDataPath DerivedData \
              -only-testing:MyCloudUITests/ScreenshotTests \
              -resultBundlePath "Shots-$SLUG.xcresult" \
              CODE_SIGNING_ALLOWED=NO > "test-$SLUG.log" 2>&1 \
              || echo "::warning::Screenshot run reported failures on $DEVICE (see logs)"
            grep -iE "test case .* (failed|skipped)|error:" "test-$SLUG.log" | sort -u | head -20 || true

            OUT="screenshots/$SLUG"
            mkdir -p "$OUT"
            xcrun xcresulttool export attachments --path "Shots-$SLUG.xcresult" --output-path "$OUT" || true
            # Rename exported files to their attachment names (05-album-light.png, …).
            OUT="$OUT" python3 -c '
          import json, os, re
          out = os.environ["OUT"]
          manifest = os.path.join(out, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for a in test.get("attachments", []):
                      name = re.sub(r"_\d+_[0-9A-F-]{36}", "", a.get("suggestedHumanReadableName", ""))
                      src = os.path.join(out, a["exportedFileName"])
                      if name and os.path.exists(src):
                          os.replace(src, os.path.join(out, name))
          print("\n".join(sorted(f for f in os.listdir(out) if f.endswith(".png"))))'
          done

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            ios/screenshots
            ios/test-*.log

