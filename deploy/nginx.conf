# TLS terminator for music.dirty.baby on :8443 → mycloud:3000

server {
    listen 8443 ssl;
    http2 on;
    server_name music.dirty.baby;

    ssl_certificate     /etc/letsencrypt/live/music.dirty.baby/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.dirty.baby/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Plain HTTP sent to the TLS port → redirect to HTTPS on the same port
    error_page 497 =301 https://$host:8443$request_uri;

    client_max_body_size 200M;

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_read_timeout 300s;

    # Audio: pass Range through, no buffering, so seeking starts instantly
    location /api/stream/ {
        proxy_pass      http://mycloud:3000;
        proxy_buffering off;
    }

    location /uploads/ {
        proxy_pass http://mycloud:3000;
        expires    7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://mycloud:3000;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;
}
