# Shared locations for both MyCloud TLS listeners (included from nginx.conf)

# Audio: pass Range through, no buffering, so seeking starts instantly
location /api/stream/ {
    proxy_pass      http://mycloud:3000;
    proxy_buffering off;
}

location /uploads/ {
    proxy_pass http://mycloud:3000;
    expires    7d;
    add_header Cache-Control "public";
}

location / {
    proxy_pass http://mycloud:3000;
}
