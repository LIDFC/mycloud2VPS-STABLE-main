# MyCloud for music.dirty.baby — HTTPS on :8443 (443 belongs to amnezia-telemt).
#
#   cd deploy && cp .env.example .env   # fill JWT_SECRET
#   docker compose up -d --build
#
# Exposes only TCP 8443 publicly. The Node backend is published on loopback
# (127.0.0.1:3000) for local checks; nginx reaches it over the compose network.

name: mycloud

services:
  mycloud:
    build: ..
    container_name: mycloud
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in deploy/.env}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://music.dirty.baby:8443}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../data:/app/server/data
      - ../uploads:/app/server/uploads
      - ../waveforms:/app/server/waveforms
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: mycloud-nginx
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      mycloud:
        condition: service_healthy
