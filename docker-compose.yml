version: "3.9"

services:
  mycloud:
    build: .
    container_name: mycloud
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://158.160.84.189}
    volumes:
      - ./data:/app/server/data
      - ./uploads:/app/server/uploads
      - ./waveforms:/app/server/waveforms
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: mycloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mycloud:
        condition: service_healthy
